# Fil rouge - podinfo après le TP6 : version 6.7.1, mise à jour sans perte de capacité, probes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: fil-rouge
  labels:
    app: podinfo
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          command:
            - ./podinfo
            - --port=9898
            - --cache-server=tcp://redis:6379
          ports:
            - containerPort: 9898
          envFrom:
            - configMapRef:
                name: podinfo-config
            - secretRef:
                name: podinfo-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9898
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: fil-rouge
spec:
  type: NodePort
  selector:
    app: podinfo
  ports:
    - port: 9898
      targetPort: 9898
      nodePort: 30080
