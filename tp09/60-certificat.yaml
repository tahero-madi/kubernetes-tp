# TP9 - une autorité auto-signée et un certificat gérés par cert-manager
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: autosigne
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: podinfo-tls
  namespace: fil-rouge
spec:
  secretName: podinfo-tls
  dnsNames:
    - podinfo.fil-rouge.svc.cluster.local
  issuerRef:
    name: autosigne
    kind: ClusterIssuer
