# Fil rouge - Redis après le TP12 : données persistantes sur le PVC redis-data
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fil-rouge
  labels:
    app: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: mirror.gcr.io/library/redis:7-alpine
          args: ["--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fil-rouge
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
