# Fil rouge - Redis, le cache de podinfo (TP5)
# Un Deployment d'un réplica et un Service ClusterIP joignable sous le nom "redis"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fil-rouge
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: mirror.gcr.io/library/redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fil-rouge
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
