# Fil rouge - podinfo, l'application web (TP5)
# 3 réplicas, configuration par ConfigMap et Secret, exposée en NodePort 30080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: fil-rouge
  labels:
    app: podinfo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.0
          command:
            - ./podinfo
            - --port=9898
            - --cache-server=tcp://redis:6379
          ports:
            - containerPort: 9898
          envFrom:
            - configMapRef:
                name: podinfo-config
            - secretRef:
                name: podinfo-secret
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: fil-rouge
spec:
  type: NodePort
  selector:
    app: podinfo
  ports:
    - port: 9898
      targetPort: 9898
      nodePort: 30080
