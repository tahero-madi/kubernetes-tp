# TP8 - budget et valeurs par défaut du namespace equipe-a
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-equipe-a
  namespace: equipe-a
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defauts-equipe-a
  namespace: equipe-a
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 200m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 512Mi
